/* ===== Sistema de cavalo (transferido de cavalo_player_montaria.html; adaptado ao jogo) ===== */
window.__createHorseSystem=function(ctx){
'use strict';
const scene=ctx.scene;
const camera=ctx.camera;
const TWO_PI=Math.PI*2;
function lerp(a,b,t){return a+(b-a)*t;}
const getElevation=(x,z)=>ctx.ground(x,z);
// Proporção: o cowboy de referência usa escala 0.90; o Vito do jogo usa a sua escala real.
// Todo o sistema do cavalo é multiplicado por RIDER_F, mantendo a mesma relação cavalo/personagem.
const RIDER_WORLD_SCALE=ctx.riderScale;
const RIDER_REF_SCALE=0.90;
const RIDER_F=RIDER_WORLD_SCALE/RIDER_REF_SCALE;
let characterRig=null;     // rig do jogador = Vito do jogo (mesmos nomes de juntas)
let horseFloatK=0;
let horseDragK=1;           // arrasto da água: 1 = terra firme; menor = mais denso (água)
let horseWaterDepth=-99;    // água acima do terreno sob o corpo do cavalo (m); >0 = patas na água
let horseLeftWaterT=99;     // segundos desde que o cavalo esteve na água
let horseWS=0;             // altura da onda sob o cavalo (m)
let horseWadeK=0;          // 0..1: água nas patas/barriga sem flutuar
const waveAtP=function(x,z){return ctx.waveAt?ctx.waveAt(x,z):ctx.waterLevel();};
let horseMsgUntil=0;        // mensagem temporária no HUD         // 0 = apoiado no chão · 1 = flutuando em água funda
// Estribos originais presos aos tornozelos do jogador; aparecem somente montado.
const stirrupMetalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.8 });
function buildStirrupFootRing() {
  const grp = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.07), stirrupMetalMat); grp.add(top);
  const sideIn = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.07), stirrupMetalMat); sideIn.position.set(-0.085, -0.09, 0); grp.add(sideIn);
  const sideOut = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.07), stirrupMetalMat); sideOut.position.set(0.085, -0.09, 0); grp.add(sideOut);
  const rest = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.045, 0.19), stirrupMetalMat); rest.position.set(0, -0.175, 0); grp.add(rest);
  grp.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return grp;
}
function buildPlayerStirrupFeet() {
  const footL = buildStirrupFootRing(); footL.position.set(0, -0.40, 0.06); footL.visible = false; characterRig.legL.ankle.add(footL); characterRig.legL.stirrupFoot = footL;
  const footR = buildStirrupFootRing(); footR.position.set(0, -0.40, 0.06); footR.visible = false; characterRig.legR.ankle.add(footR); characterRig.legR.stirrupFoot = footR;
}
function updateStirrupVisibility() {
  const visible = mountState === 'mounted';
  if (characterRig && characterRig.legL && characterRig.legL.stirrupFoot) characterRig.legL.stirrupFoot.visible = visible;
  if (characterRig && characterRig.legR && characterRig.legR.stirrupFoot) characterRig.legR.stirrupFoot.visible = visible;
}


// Rédeas dinâmicas: ligam cada ponto do focinho à mão correspondente do cavaleiro.
// A curva acompanha os movimentos do cavalo e dos braços e contorna pescoço e tronco.
let leftReinMesh = null, rightReinMesh = null;
const reinMaterial = new THREE.MeshStandardMaterial({ color: 0x2b1810, roughness: 0.9, metalness: 0.1 });
function setupReinsSystem() {
  const dummyCurve = new THREE.LineCurve3(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0.1));
  const dummyGeo = new THREE.TubeGeometry(dummyCurve, 8, 0.018 * CAMEL_PLAYER_SCALE, 6, false);
  leftReinMesh = new THREE.Mesh(dummyGeo, reinMaterial);
  rightReinMesh = new THREE.Mesh(dummyGeo.clone(), reinMaterial);
  leftReinMesh.castShadow = true; rightReinMesh.castShadow = true;
  leftReinMesh.visible = false; rightReinMesh.visible = false;
  scene.add(leftReinMesh, rightReinMesh);
}

// Correias de couro entre os pontos de fixação da sela e os estribos nos pés.
const stirrupStrapMat = new THREE.MeshStandardMaterial({ color: 0x5e2b17, roughness: 0.5, metalness: 0.1 });
let leftStirrupStrapMesh = null, rightStirrupStrapMesh = null;
function setupStirrupRopesSystem() {
  const dummyCurve = new THREE.LineCurve3(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0.1));
  const dummyGeo = new THREE.TubeGeometry(dummyCurve, 6, 0.03 * CAMEL_PLAYER_SCALE, 6, false);
  leftStirrupStrapMesh = new THREE.Mesh(dummyGeo, stirrupStrapMat);
  rightStirrupStrapMesh = new THREE.Mesh(dummyGeo.clone(), stirrupStrapMat);
  leftStirrupStrapMesh.castShadow = true; rightStirrupStrapMesh.castShadow = true;
  leftStirrupStrapMesh.visible = false; rightStirrupStrapMesh.visible = false;
  scene.add(leftStirrupStrapMesh, rightStirrupStrapMesh);
}
const _stStart = new THREE.Vector3(), _stEnd = new THREE.Vector3(), _stMid = new THREE.Vector3();
function updateSingleStirrupStrapGeometry(mesh, startPt, endPt, time, phaseOffset) {
  if (!mesh) return;
  _stMid.addVectors(startPt, endPt).multiplyScalar(0.5);
  const wW = camelAnimWeights.walk, wR = camelAnimWeights.run;
  const sway = time * 6.0 + phaseOffset;
  _stMid.x += Math.sin(sway) * 0.015 * (wW + wR);
  _stMid.z += Math.cos(sway * 0.9) * 0.015 * (wW + wR);
  const curve = new THREE.QuadraticBezierCurve3(startPt, _stMid, endPt);
  mesh.geometry.dispose();
  mesh.geometry = new THREE.TubeGeometry(curve, 12, 0.03 * CAMEL_PLAYER_SCALE, 6, false);
}
function updateStirrupRopes(time) {
  const show = mountState === 'mounted';
  const fL = characterRig && characterRig.legL && characterRig.legL.stirrupFoot;
  const fR = characterRig && characterRig.legR && characterRig.legR.stirrupFoot;
  if (fL) fL.visible = show && !window.__selfHidden;
  if (fR) fR.visible = show && !window.__selfHidden;
  if (leftStirrupStrapMesh) leftStirrupStrapMesh.visible = show && !window.__selfHidden;
  if (rightStirrupStrapMesh) rightStirrupStrapMesh.visible = show && !window.__selfHidden;
  if (!show || !fL || !fR || !cBones.stirrupGrpL || !cBones.stirrupGrpR) return;
  cBones.stirrupGrpL.updateMatrixWorld(true); cBones.stirrupGrpR.updateMatrixWorld(true);
  fL.updateMatrixWorld(true); fR.updateMatrixWorld(true);
  const anchorL = new THREE.Vector3(), anchorR = new THREE.Vector3();
  cBones.stirrupGrpL.getWorldPosition(anchorL); cBones.stirrupGrpR.getWorldPosition(anchorR);
  fL.getWorldPosition(_stStart);
  updateSingleStirrupStrapGeometry(leftStirrupStrapMesh, anchorL, _stStart.clone(), time, 0);
  fR.getWorldPosition(_stEnd);
  updateSingleStirrupStrapGeometry(rightStirrupStrapMesh, anchorR, _stEnd.clone(), time, Math.PI / 3);
}

// Cápsulas de colisão usadas para impedir que as rédeas atravessem o pescoço/tronco.
const _rcNeckA = new THREE.Vector3(), _rcNeckB = new THREE.Vector3(), _rcNeckR = { r: 0 };
const _rcTorA = new THREE.Vector3(), _rcTorB = new THREE.Vector3(), _rcTorR = { r: 0 };
const _rcAB = new THREE.Vector3(), _rcD = new THREE.Vector3(), _rcSide = new THREE.Vector3();
function pushOutOfCapsule(P, A, B, r, sideSign) {
  _rcAB.subVectors(B, A);
  const l2 = _rcAB.lengthSq() || 1e-6;
  const t = THREE.MathUtils.clamp(_rcD.subVectors(P, A).dot(_rcAB) / l2, 0, 1);
  _rcD.copy(P).addScaledVector(_rcAB, -t).sub(A);
  const len = _rcD.length();
  if (len >= r) return;
  _rcD.addScaledVector(_rcSide, sideSign * r * 0.6);
  const dl = _rcD.length() || 1e-6;
  P.copy(A).addScaledVector(_rcAB, t).addScaledVector(_rcD, r / dl);
}
function updateSingleReinGeometry(mesh, startPt, endPt, time, phaseOffset, sideSign) {
  const midPt = new THREE.Vector3().addVectors(startPt, endPt).multiplyScalar(0.5);
  let sagY = -0.12 * CAMEL_PLAYER_SCALE, waveX = 0, waveY = 0, waveZ = 0;
  const wW = camelAnimWeights.walk, wR = camelAnimWeights.run;
  const speedWalk = time * 7.0 + phaseOffset, speedRun = time * 14.0 + phaseOffset;
  sagY += Math.sin(speedWalk) * 0.04 * wW + (Math.sin(speedRun) * 0.08 + 0.05) * wR;
  waveX += Math.cos(speedWalk * 0.8) * 0.05 * wW + Math.cos(speedRun * 1.5) * 0.10 * wR;
  waveY += Math.sin(speedRun * 2.0) * 0.06 * wR;
  waveZ += Math.sin(speedWalk * 1.2) * 0.04 * wW + Math.sin(speedRun * 1.1) * 0.08 * wR;
  midPt.y += sagY + waveY; midPt.x += waveX; midPt.z += waveZ;
  const bez = new THREE.QuadraticBezierCurve3(startPt, midPt, endPt);
  const N = 16, pts = bez.getPoints(N), ropeR = 0.018 * CAMEL_PLAYER_SCALE;
  for (let pass = 0; pass < 2; pass++) {
    for (let k = 1; k < N; k++) {
      pushOutOfCapsule(pts[k], _rcNeckA, _rcNeckB, _rcNeckR.r + ropeR, sideSign);
      pushOutOfCapsule(pts[k], _rcTorA, _rcTorB, _rcTorR.r + ropeR, sideSign);
    }
    if (pass === 0) {
      for (let k = 1; k < N; k++) {
        pts[k].x = (pts[k - 1].x + pts[k].x * 2 + pts[k + 1].x) * 0.25;
        pts[k].y = (pts[k - 1].y + pts[k].y * 2 + pts[k + 1].y) * 0.25;
        pts[k].z = (pts[k - 1].z + pts[k].z * 2 + pts[k + 1].z) * 0.25;
      }
    }
  }
  mesh.geometry.dispose();
  mesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, ropeR, 6, false);
}

// As rédeas deslizam para o pito da sela durante a desmontagem e voltam às mãos ao montar.
const reinFree = [{ t: 0, active: false }, { t: 0, active: false }];
const REIN_RELEASE_AT = 0.12, REIN_SWAP_TIME = 0.3;
const _reinHorn = new THREE.Vector3();
function getReinHornAnchor() {
  if (!cBones.saddle) return null;
  if (!cBones.reinAnchor) {
    cBones.reinAnchor = new THREE.Group();
    cBones.reinAnchor.position.set(0, 0.36, 0.27);
    cBones.saddle.add(cBones.reinAnchor);
  }
  return cBones.reinAnchor;
}
// O rig do Vito não tem as âncoras de mão do cowboy de referência (só ombro e cotovelo).
// Cria uma âncora fixa no centro da mão, filha do cotovelo, para as rédeas se prenderem.
// A mão do rig fica em -1.25 × comprimento do braço (1.05) no eixo do antebraço.
const RIDER_HAND_LOCAL_Y = -1.25 * 1.05;
function ensureRiderHandAnchors() {
  if (!characterRig || !characterRig.armL || !characterRig.armR) return false;
  for (const arm of [characterRig.armL, characterRig.armR]) {
    if (arm.handAnchor || !arm.elbow) continue;
    const anchor = new THREE.Group();
    anchor.position.set(0, RIDER_HAND_LOCAL_Y, 0.05);
    arm.elbow.add(anchor);
    arm.handAnchor = anchor;
  }
  return !!(characterRig.armL.handAnchor && characterRig.armR.handAnchor);
}
function updateReinsPhysics(time, delta) {
  if (!leftReinMesh || !cBones.mouthLeft || !characterRig || !ensureRiderHandAnchors()) return;
  const dt = Math.min(delta || 0.016, 0.05);
  const showRopes = mountState === 'mounting' || mountState === 'mounted' || mountState === 'dismounting' || reinFree[0].active;
  leftReinMesh.visible = showRopes && !window.__selfHidden; rightReinMesh.visible = showRopes && !window.__selfHidden;
  if (!showRopes) return;
  const mouthL = new THREE.Vector3(), mouthR = new THREE.Vector3();
  const handL = new THREE.Vector3(), handR = new THREE.Vector3();
  cBones.mouthLeft.updateMatrixWorld(true); cBones.mouthRight.updateMatrixWorld(true);
  characterRig.armL.handAnchor.updateMatrixWorld(true); characterRig.armR.handAnchor.updateMatrixWorld(true);
  cBones.mouthLeft.getWorldPosition(mouthL); cBones.mouthRight.getWorldPosition(mouthR);
  characterRig.armL.handAnchor.getWorldPosition(handL); characterRig.armR.handAnchor.getWorldPosition(handR);
  const Sx = camelGroup ? camelGroup.scale.x : CAMEL_PLAYER_SCALE;
  cBones.root.updateMatrixWorld(true);
  cBones.neckBase.getWorldPosition(_rcNeckA); cBones.head.getWorldPosition(_rcNeckB);
  _rcNeckR.r = 0.24 * Sx;
  _rcTorA.set(0, 0.05, -0.55); _rcTorB.set(0, 0.05, 0.85);
  cBones.root.localToWorld(_rcTorA); cBones.root.localToWorld(_rcTorB);
  _rcTorR.r = 0.5 * Sx;
  _rcSide.set(Math.cos(camelState.rotation), 0, -Math.sin(camelState.rotation));
  const anchor = getReinHornAnchor();
  if (anchor) { anchor.updateMatrixWorld(true); anchor.getWorldPosition(_reinHorn); }
  const mouths = [mouthL, mouthR], hands = [handL, handR], meshes = [leftReinMesh, rightReinMesh];
  const sideOff = [0.05, -0.05];
  const releasing = (mountState === 'dismounting' && mountProgress >= REIN_RELEASE_AT) || (mountState === 'none' && reinFree[0].active);
  const grabbing = mountState === 'mounting' || mountState === 'mounted';
  for (let i = 0; i < 2; i++) {
    const r = reinFree[i];
    if (releasing && anchor) { r.active = true; r.t = Math.min(1, r.t + dt / REIN_SWAP_TIME); }
    else if (grabbing && r.active) { r.t = Math.max(0, r.t - dt / REIN_SWAP_TIME); if (r.t <= 0) r.active = false; }
    let end = hands[i];
    if (r.active && anchor) {
      const e = r.t * r.t * (3 - 2 * r.t);
      end = new THREE.Vector3().lerpVectors(hands[i], _reinHorn, e);
      if (e >= 1) { end.x += sideOff[i] * Math.cos(camelState.rotation); end.z -= sideOff[i] * Math.sin(camelState.rotation); }
    }
    updateSingleReinGeometry(meshes[i], mouths[i], end, time, i === 0 ? 0 : Math.PI / 4, i === 0 ? 1 : -1);
  }
}

  function hashSeed(t) { let h = 1779033703 ^ t.length; for (let i = 0; i < t.length; i++) { h = Math.imul(h ^ t.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
  function rngFrom(seed) { let a = hashSeed(String(seed)); return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // Raças leves (montaria) e pesadas (carroça)

  function drawHorseCoat(g, base, pk, r, gray) {
    const S = 256; // menor que 512 para performance com muitos NPCs
    const dk = mixHex(base, "#000000", .42);
    const md = mixHex(base, "#000000", .18);
    const lt = mixHex(base, "#ffffff", .22);
    const lt2 = mixHex(base, "#ffffff", .38);
    g.globalAlpha = 1; g.fillStyle = base; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 2500; i++) {
      g.globalAlpha = .055 + r() * .04;
      g.fillStyle = r() < .5 ? dk : lt;
      g.fillRect(r() * S, r() * S, 1 + r() * 2, 2 + r() * 5);

      g.globalAlpha = .04 + r() * .06;
      g.fillStyle = r() < .45 ? md : lt;
      g.beginPath(); g.ellipse(r() * S, r() * S, 12 + r() * 28, 8 + r() * 20, r() * 3, 0, 6.28); g.fill();

  function legPose(p, duty, A, K, isFront) {
    p = ((p % 1) + 1) % 1;
    const inSwing = p >= duty;
    let phi, q = 0, sRaw = 0;
    if (!inSwing) { sRaw = p / duty; phi = 0.5 * sRaw; }
    else { q = (p - duty) / Math.max(1e-4, 1 - duty); phi = 0.5 + 0.5 * q; }
    const D = Math.max(1e-4, 1 - duty);
    const m = Math.min(0.6, 0.5 * duty / D);
    const tan = 2 * m * A * D / duty;
    let upper;
    if (!inSwing) upper = A * (-(1 - m) * Math.cos(Math.PI * sRaw) + m * (2 * sRaw - 1));
    else upper = A * (4 * q * q * q - 6 * q * q + 1) + tan * (2 * q * q * q - 3 * q * q + q);
    const bell = inSwing ? Math.pow(Math.sin(Math.PI * Math.pow(q, 0.8)), 1.5) : 0;
    const stBump = inSwing ? 0 : Math.pow(Math.sin(Math.PI * sRaw), 2);
    const lower = 0.04 * K + 0.08 * K * stBump + K * (isFront ? 1.05 : 1.25) * bell;
    const w = 1 - smooth(bell * 2);
    const drop = 0.9 * 1.13 * (1 - Math.cos(upper)) * w;
    const foot = -(upper + lower) * (0.45 + 0.55 * w);
    return [upper, lower, foot, drop];

  function computeMountSidePose(sideSign, outPos, outStirrup) {
    const yaw = camelState.rotation;
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    const sx = Math.cos(yaw), sz = -Math.sin(yaw);
    const cx = camelState.pos.x, cz = camelState.pos.z;
    const px = cx + sx * sideSign * MOUNT_SIDE_DIST + fx * MOUNT_ALONG;
    const pz = cz + sz * sideSign * MOUNT_SIDE_DIST + fz * MOUNT_ALONG;
    const gy = getElevation(px, pz);
    outPos.set(px, gy, pz);
    const stirDist = MOUNT_SIDE_DIST * 0.62;
    const sx2 = cx + sx * sideSign * stirDist + fx * (MOUNT_ALONG * 0.5);
    const sz2 = cz + sz * sideSign * stirDist + fz * (MOUNT_ALONG * 0.5);
    const seatY = new THREE.Vector3();
    getCamelMountWorldPos(seatY);
    outStirrup.set(sx2, gy + (seatY.y - gy) * 0.42, sz2);

      p.armLS_X = -0.90; p.armLS_Y = 0.18; p.armLS_Z = 0.22; p.armLE_X = -0.50;
      p.legRH_X = -1.50; p.legRH_Y = -0.08; p.legRH_Z = -0.32; p.legRK_X = 1.22; p.legRA_X = -0.12;
      p.legLH_X = -0.06; p.legLH_Y = 0.04; p.legLH_Z = 0.05; p.legLK_X = 0.10; p.legLA_X = 0.04;
    }
    return p;
  }

  // Pose "passando a perna" (corpo sobre a sela, perna livre cruzando — sem esticar)
  function mtPoseSwing(out, sideSign) {
    const p = out || mtMakePose();
    for (const k in p) p[k] = 0;
    const ss = sideSign >= 0 ? 1 : -1;
    p.spineX = 0.20;
    p.hipsX = 0.08;
    p.hipsYrot = 0.16 * ss;
    p.hipsY = 0.06;
    p.headX = 0.04;
    p.armLS_X = -0.65; p.armLS_Y = 0.08; p.armLS_Z = 0.18; p.armLE_X = -0.65;
    p.armRS_X = -0.65; p.armRS_Y = -0.08; p.armRS_Z = -0.18; p.armRE_X = -0.65;
    if (ss > 0) {
      // pé esq no estribo; dir sobe dobrada (não esticada)
      p.legLH_X = -0.95; p.legLH_Y = 0.10; p.legLH_Z = 0.42; p.legLK_X = 1.05; p.legLA_X = -0.18;
      p.legRH_X = -1.45; p.legRH_Y = -0.12; p.legRH_Z = -0.48; p.legRK_X = 1.05; p.legRA_X = -0.08;
    } else {
      p.legRH_X = -0.95; p.legRH_Y = -0.10; p.legRH_Z = -0.42; p.legRK_X = 1.05; p.legRA_X = -0.18;
      p.legLH_X = -1.45; p.legLH_Y = 0.12; p.legLH_Z = 0.48; p.legLK_X = 1.05; p.legLA_X = -0.08;
    }
    return p;
  }

  // Pose sentado na sela (igual applyRidingPoseBlend(1))
  function mtPoseRide(out) {
    const p = out || mtMakePose();
    for (const k in p) p[k] = 0;
    p.legLH_X = -1.35; p.legLH_Y = 0.12; p.legLH_Z = 0.50; p.legLK_X = 1.30; p.legLA_X = -0.25;
    p.legRH_X = -1.35; p.legRH_Y = -0.12; p.legRH_Z = -0.50; p.legRK_X = 1.30; p.legRA_X = -0.25;
    p.armLS_X = -0.40; p.armLS_Y = 0.10; p.armLS_Z = 0.15; p.armLE_X = -0.60;
    p.armRS_X = -0.40; p.armRS_Y = -0.10; p.armRS_Z = -0.15; p.armRE_X = -0.60;
    p.spineX = 0.15;
    return p;
  }

  // Avalia a pose de MONTAR em t ∈ [0,1] de forma contínua (sem saltos)
  // 0.00–0.28 stand→stirrup | 0.28–0.62 stirrup→swing | 0.62–1.00 swing→ride
  const _mtEval = mtMakePose();
  const _mtK0 = mtMakePose(), _mtK1 = mtMakePose(), _mtK2 = mtMakePose(), _mtK3 = mtMakePose();

  function evalMountPose(t, sideSign, out) {
    const ss = sideSign >= 0 ? 1 : -1;
    mtPoseStand(_mtK0);
    mtPoseStirrup(_mtK1, ss);
    mtPoseSwing(_mtK2, ss);
    mtPoseRide(_mtK3);
    // Partimos do snapshot atual nos primeiros frames para não cortar a pose de caminhada
    const fromSnap = smoothstepMount(0, 0.12, t);
    let pose;
    if (t < 0.28) {
      const u = smoothstepMount(0, 0.28, t);
      pose = mtLerpPose(_mtEval, _mtK0, _mtK1, u);
    } else if (t < 0.62) {
      const u = smoothstepMount(0.28, 0.62, t);
      pose = mtLerpPose(_mtEval, _mtK1, _mtK2, u);
    } else {
      const u = smoothstepMount(0.62, 1.0, t);
      pose = mtLerpPose(_mtEval, _mtK2, _mtK3, u);
    }
    // Blend suave do snapshot inicial → pose calculada (só no começo)
    if (fromSnap < 1 && _mtSnap && typeof _mtSnap.spineX === 'number') {
      mtLerpPose(out || _mtEval, _mtSnap, pose, fromSnap);
      return out || _mtEval;
    }
    if (out) return mtCopyPose(out, pose);
    return pose;
  }

  // Avalia a pose de DESMONTAR em t ∈ [0,1] (espelho fluido do montar)
  // 0.00–0.30 ride→swing | 0.30–0.62 swing→stirrup | 0.62–1.00 stirrup→stand
  // Sempre com pernas dobradas (nunca esticadas)
  function evalDismountPose(t, sideSign, out) {
    const ss = sideSign >= 0 ? 1 : -1;
    mtPoseRide(_mtK0);
    mtPoseSwing(_mtK1, ss);
    mtPoseStirrup(_mtK2, ss);
    mtPoseStand(_mtK3);
    const fromSnap = smoothstepMount(0, 0.10, t);
    let pose;
    if (t < 0.30) {
      const u = smoothstepMount(0, 0.30, t);
      pose = mtLerpPose(_mtEval, _mtK0, _mtK1, u);
    } else if (t < 0.62) {
      const u = smoothstepMount(0.30, 0.62, t);
      pose = mtLerpPose(_mtEval, _mtK1, _mtK2, u);
    } else {
      const u = smoothstepMount(0.62, 1.0, t);
      pose = mtLerpPose(_mtEval, _mtK2, _mtK3, u);
    }
    if (fromSnap < 1 && _mtSnap && typeof _mtSnap.spineX === 'number') {
      mtLerpPose(out || _mtEval, _mtSnap, pose, fromSnap);
      return out || _mtEval;
    }
    if (out) return mtCopyPose(out, pose);
    return pose;
  }

  // Posição contínua: Catmull-Rom simples entre 3 pontos (chão, estribo, sela)
  function mtCatmullPos(p0, p1, p2, t, out) {
    // t 0..1 ao longo de p0→p1→p2, com tensão suave
    const t1 = 0.40; // chega no estribo
    if (t <= t1) {
      const u = easeInOutQuadMount(t / t1);
      out.lerpVectors(p0, p1, u);
      // leve elevação no meio do passo
      out.y += Math.sin(u * Math.PI) * 0.10 * CAMEL_PLAYER_SCALE;
    } else {
      const u = easeInOutCubicMount((t - t1) / (1 - t1));
      out.lerpVectors(p1, p2, u);
      // arco natural de subida, decaindo ao sentar
      out.y += Math.sin(u * Math.PI) * 0.28 * CAMEL_PLAYER_SCALE * (1 - u * 0.55);
    }
    return out;
  }



function startMounting(){
  if(mountState!=='none')return;
  if(!horseNearPlayer())return;
  horseFree.mode=null; horseFree.timer=0; horseFree.brake=1;
  mountSideSign=1;
  mountApproachRot=computeMountSidePose(mountSideSign,mountApproachPos,mountStirrupPos);
  mountStartPos.copy(characterRig.position);
  mountStartRot=characterRig.rotation.y;
  mountProgress=0;mountState='mounting';
  captureMountBoneSnapshot();

}
// Desmontagem permitida só em terra firme: sem flutuação, sem água sob o corpo e
// já fora da água há um tempo (cobre a transição de saída). Entrada e saída bloqueadas.
function horseCanDismount(){
  return horseFloatK<=0.01 && horseWaterDepth<=0.05 && horseLeftWaterT>=0.6;
}

function startDismounting(){
  if(mountState!=='mounted')return;
  const wasGallop = horseGaitLevel >= 3 || P.f > (GAITS.trot.f + 0.25);
  const wasTrot = !wasGallop && (horseGaitLevel === 2 || P.f > (GAITS.walk.f + 0.25));
  horseFree.mode = wasGallop ? 'gallop' : wasTrot ? 'trot' : (P.f > 0.002 ? 'walk' : null);
  horseFree.timer = 0; horseFree.brake = 1;
  horseGaitLevel = 0; decelTimer = 0; shiftWasDown = false;
  getCamelMountWorldPos(_mtSeat);
  detachRiderFromHorse();
  mountProgress=0;mountState='dismounting';
  mountApproachRot=computeMountSidePose(mountSideSign,dismountEndPos,mountStirrupPos);
  dismountEndPos.y=0;
  dismountEndRot=mountApproachRot;

}
function updateMountTransition(delta){
  mountProgress=Math.min(1,mountProgress+delta/MOUNT_DURATION);
  const t=mountProgress;
  if(mountState==='mounting'){
    getCamelMountWorldPos(_mtSeat);
    computeMountSidePose(mountSideSign,mountApproachPos,mountStirrupPos);
    mtCatmullPos(mountStartPos,mountStirrupPos,_mtSeat,t,_mtPosTmp);
    characterRig.position.copy(_mtPosTmp);
    let diff=mountApproachRot-mountStartRot;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff< -Math.PI)diff+=Math.PI*2;
    const faceT=smoothstepMount(0,.22,t),alignT=smoothstepMount(.45,.95,t);
    const yawNow=mountStartRot+diff*faceT;
    let toHorse=camelState.rotation-yawNow;
    while(toHorse>Math.PI)toHorse-=Math.PI*2;while(toHorse< -Math.PI)toHorse+=Math.PI*2;
    characterRig.rotation.y=yawNow+toHorse*alignT;
    mtApplyPoseObj(evalMountPose(t,mountSideSign,_mtEval));
    if(t>=1){applyRidingPoseBlend(1);attachRiderToHorse();mountState='mounted';updateButtons();}
  }else if(mountState==='dismounting'){
    getCamelMountWorldPos(_mtSeat);
    const faceYaw=computeMountSidePose(mountSideSign,dismountEndPos,mountStirrupPos);
    mtCatmullPos(_mtSeat,mountStirrupPos,dismountEndPos,t,_mtPosTmp);
    characterRig.position.copy(_mtPosTmp);
    let diff=faceYaw-camelState.rotation;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff< -Math.PI)diff+=Math.PI*2;
    const turnT=smoothstepMount(.15,.70,t);
    characterRig.rotation.y=camelState.rotation+diff*turnT;
    mtApplyPoseObj(evalDismountPose(t,mountSideSign,_mtEval));
    if(t>=1){
      mountState='none';characterRig.position.copy(dismountEndPos);characterRig.rotation.set(0,dismountEndRot,0);resetPlayerPose();setPlayerGait('idle');updateButtons();
    }
  }
}

// Controlador completo de montaria do jogo original.
// Shift alterna as marchas; a velocidade real é derivada da animação do cavalo.
let horseGaitLevel = 0; // 0 parado, 1 andar, 2 trote, 3 galope
let shiftWasDown = false;
let decelTimer = 0;
let horseMotionSpeed = 0;
const horseMotionDir = new THREE.Vector3(0, 0, 1);
// Velocidades originais do HTML de referência (9 / 17 / 28), convertidas pela mesma razão
// de escala usada no cavalo (RIDER_F = escala real do Vito / 0.90 do cowboy de referência).
// Assim a relação velocidade × tamanho do cavalo e do cavaleiro continua igual à referência,
// e a passada (cyc/P.f) segue proporcional às pernas escaladas, sem deslizar no chão.
const HORSE_SPEED_BOOST = 1.2;               // ajuste de jogabilidade: +20% sobre a referência
const HORSE_SPEED_K = RIDER_F * HORSE_SPEED_BOOST;
const HORSE_WALK_SPEED = 9.0 * HORSE_SPEED_K;
const HORSE_TROT_SPEED = 17.0 * HORSE_SPEED_K;
const HORSE_GALLOP_SPEED = 28.0 * HORSE_SPEED_K;
const horseFree = { mode: null, timer: 0, brake: 1 };
function horseSpeedFromAnimation(f) { return horseSpeedRaw(f) * horseDragK; }
function horseSpeedRaw(f) {
  if (f <= 0.0001) return 0;
  if (f < GAITS.walk.f) return THREE.MathUtils.lerp(0, HORSE_WALK_SPEED, f / GAITS.walk.f);
  if (f < GAITS.trot.f) return THREE.MathUtils.lerp(HORSE_WALK_SPEED, HORSE_TROT_SPEED,
    (f - GAITS.walk.f) / (GAITS.trot.f - GAITS.walk.f));
  return THREE.MathUtils.lerp(HORSE_TROT_SPEED, HORSE_GALLOP_SPEED,
    Math.max(0, Math.min(1, (f - GAITS.trot.f) / (GAITS.gallop.f - GAITS.trot.f))));
}
const keys = {};
function updateMountedController(delta) {
  if (mountState !== 'mounted' || !camelGroup) return;
  horseFree.mode = null;
  const dir = new THREE.Vector3(0, 0, 0);
  let moving = false;
  if (keys.w || keys.arrowup) { dir.z -= 1; moving = true; }
  if (keys.s || keys.arrowdown) { dir.z += 1; moving = true; }
  if (keys.a || keys.arrowleft) { dir.x -= 1; moving = true; }
  if (keys.d || keys.arrowright) { dir.x += 1; moving = true; }
  // Cada toque de Shift avança: andar → trote → galope → andar.
  if (keys.shift && !shiftWasDown && moving) {
    if (horseGaitLevel < 2) horseGaitLevel = 2;
    else if (horseGaitLevel === 2) horseGaitLevel = 3;
    else horseGaitLevel = 1;
  }
  shiftWasDown = !!keys.shift;
  if (moving) {
    dir.normalize();
    dir.applyEuler(new THREE.Euler(0, orbitYaw, 0));
    const targetRot = Math.atan2(dir.x, dir.z);
    let diff = targetRot - camelState.rotation;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    camelState.rotation += diff * 5.0 * delta;
    if (horseGaitLevel < 1) horseGaitLevel = 1;
    decelTimer = 0;
  } else {
    decelTimer += delta;
    if (horseGaitLevel >= 3 && decelTimer > 0.35) { horseGaitLevel = 2; decelTimer = 0; }
    else if (horseGaitLevel === 2 && decelTimer > 0.40) { horseGaitLevel = 1; decelTimer = 0; }
    else if (horseGaitLevel === 1 && decelTimer > 0.55) { horseGaitLevel = 0; decelTimer = 0; }
  }
  const gaitName = horseGaitLevel >= 3 ? 'gallop' : horseGaitLevel >= 2 ? 'trot' : horseGaitLevel === 1 ? 'walk' : 'idle';
  setPlayerGait(gaitName);
  horseMotionSpeed = horseSpeedFromAnimation(P.f);
  if (moving) horseMotionDir.set(Math.sin(camelState.rotation), 0, Math.cos(camelState.rotation));
  else if (horseGaitLevel === 0 && P.f <= 0.002) horseMotionSpeed = 0;
  camelState.pos.x += horseMotionDir.x * horseMotionSpeed * delta;
  camelState.pos.z += horseMotionDir.z * horseMotionSpeed * delta;
}

// O cavalo mantém a inércia e desacelera suavemente ao ser deixado livre.
function updateFreeHorse(delta) {
  if (!camelGroup) return;
  const m = horseFree.mode;
  let speed = 0;
  if (m === 'gallop') {
    horseFree.timer += delta;
    setPlayerGait(horseFree.timer < 0.9 ? 'walk' : 'idle');
    speed = horseSpeedFromAnimation(P.f) * 0.7;
  } else if (m) {
    setPlayerGait('idle');
    const rate = m === 'trot' ? 2.6 : m === 'walk' ? 3.5 : 5.0;
    horseFree.brake = Math.max(0, horseFree.brake - rate * delta);
    speed = horseSpeedFromAnimation(P.f) * horseFree.brake;
  } else {
    setPlayerGait('idle');
  }
  horseMotionSpeed = speed;
  if (speed > 0.001) {
    camelState.pos.x += horseMotionDir.x * speed * delta;
    camelState.pos.z += horseMotionDir.z * speed * delta;
  }
  if (m && P.f <= 0.002 && speed <= 0.001 && (m !== 'gallop' || horseFree.timer >= 0.9)) {
    horseFree.mode = null; horseMotionSpeed = 0;
  }
}

// Marcas na água próprias do cavalo: cada casco que entra/anda deixa um par de anéis
// alongado (um no casco, outro atrás), e o peito/flancos deixam esteira quando se move.
function horseWaterFx(dt,t){
  const rip=ctx.rip;
  if(!rip||!camelGroup)return;
  const WS=horseWS;
  const S=camelGroup.scale.x;
  const sp=Math.abs(horseMotionSpeed)||0;
  const spN=Math.min(1,sp/HORSE_TROT_SPEED);
  const fx=Math.sin(camelState.rotation), fz=Math.cos(camelState.rotation);
  const names=['FL','FR','BL','BR'];
  for(let i=0;i<4;i++){
    const f=cBones['f_'+names[i]];
    if(!f)continue;
    f.getWorldPosition(_wfxV);
    const bed=getElevation(_wfxV.x,_wfxV.z);
    const WSh=bed<WS+1?waveAtP(_wfxV.x,_wfxV.z):0;
    const inW=(WSh-bed)>0.05&&_wfxV.y<WSh+0.02;
    if(inW&&!WFX.inW[i]){
      rip.emit(_wfxV.x,_wfxV.z,0.010+0.022*spN,t);
      rip.emit(_wfxV.x-fx*0.28*S/CAMEL_PLAYER_SCALE,_wfxV.z-fz*0.28*S/CAMEL_PLAYER_SCALE,0.006+0.012*spN,t);
      WFX.lastX[i]=_wfxV.x;WFX.lastZ[i]=_wfxV.z;
    }else if(inW&&sp>0.8){
      const d=Math.hypot(_wfxV.x-WFX.lastX[i],_wfxV.z-WFX.lastZ[i]);
      if(d>0.9*S/CAMEL_PLAYER_SCALE){
        rip.emit(_wfxV.x,_wfxV.z,0.008+0.018*spN,t);
        WFX.lastX[i]=_wfxV.x;WFX.lastZ[i]=_wfxV.z;
      }
    }
    WFX.inW[i]=inW;
  }
  // esteira do corpo: peito e flancos, só quando o cavalo se move na água
  const bodyBed=getElevation(camelState.pos.x,camelState.pos.z);
  if(sp>1.0&&(WS-bodyBed)>0.3){
    WFX.body+=dt;
    if(WFX.body>=0.42){
      WFX.body=0;
      const cx=camelState.pos.x,cz=camelState.pos.z;
      const chestX=cx+fx*0.85*S, chestZ=cz+fz*0.85*S;
      const sxv=Math.cos(camelState.rotation), szv=-Math.sin(camelState.rotation);
      rip.emit(chestX,chestZ,0.012*spN+0.004,t);
      rip.emit(cx+sxv*0.5*S-fx*0.4*S,cz+szv*0.5*S-fz*0.4*S,0.008*spN+0.003,t);
      rip.emit(cx-sxv*0.5*S-fx*0.4*S,cz-szv*0.5*S-fz*0.4*S,0.008*spN+0.003,t);
    }
  }else WFX.body=0;
}

// Câmera de montaria: usa o mesmo giro/zoom da câmera do jogo.
// ===== Colisão do cavalo (espaço local: x = lateral, z = frente, y = altura do chão) =====
// Caixas proporcionais ao modelo (unidades locais × escala S). Não são geometria visual.
// Helpers de coordenadas do cavalo (usados pela colisão do jogador)
function horseLocal(wx,wy,wz){
  const dx=wx-camelState.pos.x, dz=wz-camelState.pos.z, r=camelState.rotation, c=Math.cos(r), s=Math.sin(r);
  return [dx*c-dz*s, wy-camelState.pos.y, dx*s+dz*c];
}
function horseDeltaToWorld(lx,lz){
  const r=camelState.rotation, c=Math.cos(r), s=Math.sin(r);
  return [lx*c+lz*s, -lx*s+lz*c];
}
// Jogador a pé: o cavalo desmontado é um obstáculo (corpo como retângulo, cabeça como círculo).
function horseSolid2D(x,z,pr){
  const p=horseLocal(x,camelState.pos.y,z), S=camelGroup.scale.x;
  let lx=p[0], lz=p[2];
  const hw=0.36*S+pr, z0=-1.05*S-pr, z1=0.95*S+pr;
  if(Math.abs(lx)<hw && lz>z0 && lz<z1){
    const c=[[hw-lx,'r'],[lx+hw,'l'],[z1-lz,'f'],[lz-z0,'b']].sort((a,b2)=>a[0]-b2[0]);
    const k=c[0][1];
    if(k==='r')lx=hw; else if(k==='l')lx=-hw; else if(k==='f')lz=z1; else lz=z0;
  } else {
    const hc=1.45*S, hr=0.4*S+pr, dz=lz-hc, dd=Math.hypot(lx,dz);
    if(dd<hr&&dd>1e-6){const f=hr/dd; lx*=f; lz=hc+dz*f;}
  }
  const d=horseDeltaToWorld(lx-p[0], lz-p[2]);
  return [x+d[0], z+d[1]];
}

// ===== Colisão do cavalo com todos os sólidos do cenário =====
// Usa a mesma grade de sólidos (__solids) do jogador: coqueiros e pedras grandes/médias já
// registradas com __solidAdd. Qualquer novo sólido registrado também bloqueia o cavalo.
// O corpo do cavalo vira 4 círculos no plano XZ ao longo do eixo frente/trás:
// três cobrem o corpo (raio 0,36 × S, a mesma largura usada em horseSolid2D) e um cobre
// a cabeça/pescoço (raio 0,40 × S). Copa e folhas não entram. Valores: [deslocamento frontal × S, raio × S].
const HORSE_PALM_BODY=[[-0.7,0.36],[0,0.36],[0.7,0.36],[1.4,0.40]];
// Empurra os círculos do cavalo para fora dos troncos, com a mesma lógica do jogador a pé:
// a posição é corrigida pela normal do contato, o que permite contornar o tronco.
function horseSolidPush(x,z){
  const G=window.__solidGrid; if(!G||!camelGroup)return [x,z];
  const S=camelGroup.scale.x, rot=camelState.rotation, fx=Math.sin(rot), fz=Math.cos(rot);
  for(let it=0;it<3;it++){
    let any=false;
    for(const [off,rad0] of HORSE_PALM_BODY){
      const rad=rad0*S;
      let cx=x+fx*off*S, cz=z+fz*off*S;
      const gx=Math.floor(cx/G.cell), gz=Math.floor(cz/G.cell);
      for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
        const arr=G.map.get((gx+i)+','+(gz+j)); if(!arr)continue;
        for(const o of arr){
          const dx=cx-o.x, dz=cz-o.z, d=Math.hypot(dx,dz), m=(o.p?window.__profR(o.p,dx,dz):o.r)+rad;
          if(d<m){
            let ux=1, uz=0, pen=m+0.002;                 // folga mínima: evita tremor no contato
            if(d>1e-6){ux=dx/d;uz=dz/d;pen=m-d+0.002;}
            x+=ux*pen; z+=uz*pen; cx+=ux*pen; cz+=uz*pen; any=true;

}
// Varredura do deslocamento do frame em passos de até 8 cm, para não atravessar obstáculos
// em velocidade alta. Também respeita os limites do mundo, como o jogador. Vale para o cavalo
// montado e livre (não depende de isMounted/isRiding). Se um passo sair do mundo, o cavalo
// para no último ponto válido, sem teletransporte.
function horseSolidSweep(px0,pz0){
  const P=camelState.pos;
  const dx=P.x-px0, dz=P.z-pz0;
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.08));
  const inW=window.__inWorld;
  let x=px0, z=pz0;
  for(let k=0;k<n;k++){
    const q=horseSolidPush(x+dx/n, z+dz/n);
    if(inW && !inW(q[0],q[1])) break;
    x=q[0]; z=q[1];

// ===== Colisão da câmera com o volume real do cavalo =====
// Usa as próprias malhas do camelGroup (todas, incluindo filhos e ossos animados).
// Cada malha é testada como caixa no seu espaço local, com a matriz de mundo deste frame,
// então pitch, roll, escala, animação de pernas, pescoço e cabeça entram no cálculo.
const HORSE_CAM_RADIUS=0.3;    // raio do volume da câmera (unidades do mundo)
let horseCamW=0;               // peso da correção: 0 = posição desejada livre, 1 = totalmente corrigida
const horseVols=[];            // pool reutilizável: {m, inv, bmin, bmax}
let horseVolsN=0;
const _hvA=new THREE.Vector3(), _hvB=new THREE.Vector3(), _hvC=new THREE.Vector3();
function horseCollectVolumes(){
  horseVolsN=0;
  camelGroup.updateMatrixWorld(true);
  camelGroup.traverse(function(o){
    if(!o.isMesh||!o.visible||!o.geometry)return;
    const g=o.geometry;
    if(!g.boundingBox)g.computeBoundingBox();
    let e=horseVols[horseVolsN];
    if(!e){e={m:null,inv:new THREE.Matrix4(),bmin:null,bmax:null};horseVols[horseVolsN]=e;}
    e.m=o; e.bmin=g.boundingBox.min; e.bmax=g.boundingBox.max;

function horseVolInside(p,mL){
  for(let i=0;i<horseVolsN;i++){
    const e=horseVols[i];
    _hvA.copy(p).applyMatrix4(e.inv);
    const L=_hvA;
    if(L.x>e.bmin.x-mL&&L.x<e.bmax.x+mL&&L.y>e.bmin.y-mL&&L.y<e.bmax.y+mL&&L.z>e.bmin.z-mL&&L.z<e.bmax.z+mL)return true;
  }

}
// Empurra p para fora de todos os volumes: escolhe a face mais próxima de cada caixa tocada.
function horseVolResolve(p,mL){
  for(let it=0;it<3;it++){
    let moved=false;
    for(let i=0;i<horseVolsN;i++){
      const e=horseVols[i];
      _hvA.copy(p).applyMatrix4(e.inv);
      const L=_hvA;
      if(!(L.x>e.bmin.x-mL&&L.x<e.bmax.x+mL&&L.y>e.bmin.y-mL&&L.y<e.bmax.y+mL&&L.z>e.bmin.z-mL&&L.z<e.bmax.z+mL))continue;
      const c=[
        [L.x-(e.bmin.x-mL),0,e.bmin.x-mL],[(e.bmax.x+mL)-L.x,0,e.bmax.x+mL],
        [L.y-(e.bmin.y-mL),1,e.bmin.y-mL],[(e.bmax.y+mL)-L.y,1,e.bmax.y+mL],
        [L.z-(e.bmin.z-mL),2,e.bmin.z-mL],[(e.bmax.z+mL)-L.z,2,e.bmax.z+mL]
      ];
      c.sort(function(x,y){return x[0]-y[0];});
      const ax=c[0][1], v=c[0][2];
      if(ax===0)L.x=v; else if(ax===1)L.y=v; else L.z=v;
      _hvB.copy(L).applyMatrix4(e.m.matrixWorld);
      p.copy(_hvB); moved=true;
    }

}
// Caminho alvo→câmera: amostra o trecho para achar o primeiro contato com o cavalo e refina
// o ponto de contato por bisseção (sem quantização, então a posição varia de forma contínua).
function horseCamPath(T,D,mL){
  const N=12; let seen=false, lastOut=null, hitIn=null;
  for(let i=1;i<=N;i++){
    _hvC.copy(T).lerp(D,i/N);
    if(!horseVolInside(_hvC,mL)){seen=true; lastOut=_hvC.clone();}
    else if(seen){hitIn=_hvC.clone();break;}
  }
  let base=D;
  if(hitIn){
    // lo = último ponto livre, hi = ponto dentro; bisseção até a superfície
    const lo=lastOut.clone(), hi=hitIn.clone(), mid=new THREE.Vector3();
    for(let k=0;k<8;k++){
      mid.addVectors(lo,hi).multiplyScalar(0.5);

// Guarda universal da câmera (independente de montaria). T = ponto observado, D = posição
// desejada, dt = tempo do frame. Retorna a posição segura, sem saltos:
// - sem obstáculo, devolve D exatamente (sem atraso);
// - com obstáculo, interpola de D até a posição segura com peso w, e a posição resultante é
//   sempre levada à superfície pelo caminho, então nunca atravessa o cavalo.
const HORSE_GUARD_RANGE=12;   // fora deste alcance do cavalo, a checagem é pulada
const _gA=new THREE.Vector3(), _gB=new THREE.Vector3(), _gC=new THREE.Vector3();
function horseGuardCamera(T,D,waterFloor,dt,ignoreHorse){
  const C=camelState.pos;

  const tt=len2>1e-8 ? Math.max(0,Math.min(1,_gB.subVectors(C,T).dot(_gA)/len2)) : 0;

  if(_gC.distanceTo(C)>HORSE_GUARD_RANGE){horseCamW=0; return D.clone();}

  // protegidos por __camRockGuard (antes desta função) e pelo piso/água.
  if(ignoreHorse)horseVolsN=0; else horseCollectVolumes();
  const mL=HORSE_CAM_RADIUS/camelGroup.scale.x;
  const S=horseCamPath(T,D,mL);                          // posição segura para a desejada
  // peso de correção contínuo (sem limiar binário): a correção cresce conforme a obstrução
  // aumenta e some sem saltos. Entrada rápida, saída lenta; taxas dependem de dt, não do FPS.
  const target=THREE.MathUtils.clamp((S.distanceTo(D)-0.005)/0.04,0,1);
  const rate=target>horseCamW?12:4;
  horseCamW+=(target-horseCamW)*(1-Math.exp(-rate*Math.min(dt||0,0.1)));
  const P = horseCamW>1e-3 ? D.clone().lerp(S,horseCamW) : D.clone();

// Exposta para a câmera livre (jogador a pé), no código principal.
window.__horseCamGuard=function(T,D,dt){
  return horseGuardCamera(new THREE.Vector3(T.x,T.y,T.z), new THREE.Vector3(D.x,D.y,D.z), -1e9, dt);
};

function updateRideCamera(dt){
  const o=ctx.getOrbit();
  orbitYaw=o.yaw;orbitPitch=o.pitch;
  const dist=Math.max(4.5,Math.min(16,o.dist*1.25));

  // Sem interpolação do piso, para não oscilar perto da superfície.
  const waterFloor=horseWS+0.45;

}

// Molhado do cavalo: reutiliza o mesmo sistema de roupa molhada do jogador. Só muda a raiz
// (o cavalo), as peças elegíveis (pelagem marcada) e a classe de material (pelo).
const horseWet = window.createWetClothing({
  getRoot: function () { return camelGroup; },

function horseFrame(dt,time){

setPlayerGait('idle');updateGaitButtons('idle');updateButtons();
updateReinsPhysics(0,0.016);updateStirrupRopes(0);
horseFrame(0.0001,0);

  frame:horseFrame,
  riding:riding,
  nearPlayer:horseNearPlayer,

};

// Ligação chamada pelo jogo depois de criar o mundo e o personagem
window.__horseBoot=function(g){

    getOrbit:()=>G.getOrbit(),

  const N=__PROF_N; let any=false; for(let k=0;k<N;k++)if(prof[k]>0)any=true;

    let a=1,b=1; while(a<N&&!prof[(k-a+N)%N])a++; while(b<N&&!prof[(k+b)%N])b++;

function __waveY(x,z,t,g){

  if(oc<=0.12)return 0;

  h+=Math.sin((x*0.022+z*-0.008)*TAU+t*0.48+3.1)*0.28;
  h+=Math.sin((x*0.055+z*0.040)*TAU+t*1.15)*0.18;
  h+=Math.sin((x*-0.048+z*0.062)*TAU+t*1.35+2.0)*0.14;

// Aproximação rápida, retorno lento (sem pulos); acima do topo da pedra a câmera passa livre.
function __rockBlocked(x,y,z,m){
  const cx=Math.floor(x/__SOLID_CELL),cz=Math.floor(z/__SOLID_CELL);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const arr=__solids.get((cx+i)+','+(cz+j));if(!arr)continue;
    for(const o of arr){
      if(y>o.top+m)continue;
      const dx=x-o.x,dz=z-o.z,R=(o.p?__profR(o.p,dx,dz):o.r)+m;

/* ================================================================

   - Volume da câmera com raio variável: fino junto ao personagem (não reage ao contato
     do corpo) e cheio a partir de ~1,2 m (não atravessa paredes nem fica parcialmente dentro).
   - Zona do corpo: os primeiros 0,5 m do trajeto não bloqueiam a câmera, então o contato
     do personagem com a casa não a puxa. Escadas (kind 'escada') só colidem com o personagem.
   - Única exceção: sólidos que já contêm o próprio ponto observado (contato embutido).
     Não há regra de proximidade ao personagem: era essa regra que deixava a câmera passar
     por paredes e portas vizinhas ao personagem.

   - Estabilidade: a fração permitida é suavizada no tempo (subida lenta); bloqueios reais

  // parede, cai dentro dela; usá-lo faria a exceção de "embutido" ignorar a parede da porta.
  const anc=window.__camRootAnchor;

  const h=Math.min(dt||0.016,0.1);
  const M=0.22;          // raio do volume da câmera (a partir de ~1,2 m do personagem); folga de 22 cm das superfícies
  const M_NEAR=0.12;     // raio junto ao personagem: só o necessário para não tocar o próprio corpo
  const RAMP0=0.5, RAMP1=1.2;

  // sólidos que já contêm o ponto observado: contato embutido, única exceção
  __crIgn.clear();
  {
    const cx=Math.floor(T.x/__SOLID_CELL), cz=Math.floor(T.z/__SOLID_CELL);
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      const arr=__solids.get((cx+i)+','+(cz+j)); if(!arr)continue;
      for(const o of arr){
        const ox=T.x-o.x, oz=T.z-o.z;
        const R=(o.p?__profR(o.p,ox,oz):o.r)+M_NEAR;
        if(o.k!=='escada'&&T.y<=o.top+M_NEAR && ox*ox+oz*oz<R*R)__crIgn.add(o);
      }
    }
  }

  // sólidos próximos ao trajeto (uma coleta por chamada; as amostras só percorrem esta lista)
  {
    const m=6;                              // folga: raio de sólidos + desvio lateral + volume da câmera
    const x0=Math.min(T.x,D.x)-m, x1=Math.max(T.x,D.x)+m;
    const z0=Math.min(T.z,D.z)-m, z1=Math.max(T.z,D.z)+m;
    __crNear.length=0;
    for(let cx=Math.floor(x0/__SOLID_CELL);cx<=Math.floor(x1/__SOLID_CELL);cx++)
      for(let cz=Math.floor(z0/__SOLID_CELL);cz<=Math.floor(z1/__SOLID_CELL);cz++){
        const arr=__solids.get(cx+','+cz); if(!arr)continue;

      }

  };

    for(let q=0;q<__crNear.length;q++){
      const o=__crNear[q];
      if(y>o.top+rad)continue;

      if(ox*ox+oz*oz<R*R)return true;

  // de atravessamento real de parede
  const penDepth=(x,y,z,rad)=>{

    const u0=Math.min(1,BODY_ZONE/L);   // zona do corpo: o contato do personagem não puxa a câmera
    for(let i=1;i<=N;i++){

        }

        // tangente a quina → rasa; atravessamento de parede → profunda

  const a0=sweep(D.x,D.y,D.z), depth0=__crDepth;

  const dx0=D.x-T.x, dz0=D.z-T.z, lenH=Math.hypot(dx0,dz0);

    }

  }
  __crLat+=(__crPick-__crLat)*(1-Math.exp(-6*h));

  //    quando há atravessamento real (segurança); suavizada só para tangência rasa a quina.
  const shallow=aF<0.999 && depthF<0.12;   // tangente a quina/borda: não é atravessamento
  const rate=aF<__crK?(shallow?7:14):2.6;

    T.x+(Dl.x-T.x)*k,
    T.y+(Dl.y-T.y)*k,
    T.z+(Dl.z-T.z)*k

};

// Raio do contorno na direção (dx,dz) a partir do centro do sólido.
function __profR(prof,dx,dz){
  // interpolação linear entre setores: o raio varia continuamente com o ângulo (sem degraus → sem tremor)
  const N=__PROF_N, u=((Math.atan2(dz,dx)+Math.PI)/(2*Math.PI))*N-0.5, k0=Math.floor(u), f=u-k0;
  const a=prof[((k0%N)+N)%N], b=prof[(((k0+1)%N)+N)%N];
  return a+(b-a)*f;
}

function __solidResolve(x,z,pr){
  for(let it=0;it<2;it++){
    const cx=Math.floor(x/__SOLID_CELL), cz=Math.floor(z/__SOLID_CELL);
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      const arr=__solids.get((cx+i)+','+(cz+j)); if(!arr)continue;
      for(const o of arr){
        const dx=x-o.x, dz=z-o.z, d=Math.hypot(dx,dz), m=(o.p?__profR(o.p,dx,dz):o.r)+pr;

  return [x,z];
}

// ponto de layout (unidades da cidade) -> mundo
const W=(ux,uz)=>[CX+ux*K,CZ+uz*K];
// ponto local da construção (unidades) -> mundo, respeitando posição e rotação
const toW=(b,lx,lz)=>{const c=Math.cos(b.y),s=Math.sin(b.y);return W(b.x+lx*c+lz*s,b.z-lx*s+lz*c);};
// amostras do relevo real (mesmo terreno que o personagem pisa)
const sampleRect=(b,r,n)=>{const out=[];for(let i=0;i<=n;i++)for(let j=0;j<=n;j++){const p=toW(b,r.cx-r.hx+2*r.hx*i/n,r.cz-r.hz+2*r.hz*j/n);out.push(dm(p[0],p[1]));}return out;};
// anel de colisão: círculos (raio RC) encostados por dentro das paredes; o personagem (raio 0.25)
// para exatamente na face da parede. Aberturas são as arestas que não recebem círculos.
const RC=0.3;
function solidRing(P,top,skipEdges){
  let A=0;for(let i=0;i<P.length;i++){const a=P[i],q=P[(i+1)%P.length];A+=a[0]*q[1]-q[0]*a[1];}
  const sg=A>0?1:-1, N=P.length;
  // normal interna de cada aresta (unitária)
  const nrm=[];
  for(let i=0;i<N;i++){const a=P[i],q=P[(i+1)%N],ex=q[0]-a[0],ez=q[1]-a[1],L=Math.hypot(ex,ez);nrm.push([-ez/L*sg,ex/L*sg]);}
  // vértices recuados pela interseção das duas arestas (miter): os círculos das quinas ficam
  // exatamente no canto interno, sem projetar a quina para fora da face da parede
  const inset=[];
  for(let i=0;i<N;i++){
    const n1=nrm[(i+N-1)%N], n2=nrm[i], a=P[i];
    const d=1+n1[0]*n2[0]+n1[1]*n2[1], f=d>1e-6?1/d:1;
    inset.push([a[0]+(n1[0]+n2[0])*f*RC*K, a[1]+(n1[1]+n2[1])*f*RC*K]);
  }
  for(let i=0;i<N;i++){
    if(skipEdges&&skipEdges.includes(i))continue;
    const a=inset[i],q=inset[(i+1)%N],ex=q[0]-a[0],ez=q[1]-a[1],L=Math.hypot(ex,ez);
    const n=Math.max(1,Math.ceil(L/(0.4*K)));
    for(let k=0;k<=n;k++){const t=k/n;__solidAdd(a[0]+ex*t,a[1]+ez*t,RC*K,'aurelas',null,top);}
  }
}

function __addFountainWater(sc,cx,cz,y,r,depth){

  if(!mat){console.warn('[Cidade Aurelas] material da água dos rios indisponível: fonte sem água');return;}

  g.setAttribute('aDepth',new THREE.Float32BufferAttribute(new Float32Array(n).fill(depth),1));

    SPECIES.forEach(function (sp) {
      sp.hh = sp.len * CFG.spriteScale * (CH / CW) * 0.5;   // meia altura do sprite (m)
      sp.cTop = sp.hh * 1.25 + 0.04;                          // folga mínima abaixo da superfície
      sp.cBot = sp.hh * 0.9 + 0.03;                           // folga mínima acima do leito
      sp.minWater = sp.cTop + sp.cBot + 0.10;                  // água mínima para caber o peixe
    });
    function yBand(sp, frac, D) { return -(sp.cTop + frac * (D - sp.cTop - sp.cBot)); }
    var rivers = env.rivers || [];
    var boulders = env.boulders || [];           // array {x,y,z,sx,sy,sz} (preenchido pelo jogo)
    var HALF = env.worldHalf || 1024;
    var rnd = env.random || Math.random;
    var now = function () { return (typeof performance !== 'undefined' ? performance.now() : Date.now()); };

    var CS = CFG.cellSize, STEP = CFG.gridStep, G = Math.round(CS / STEP) + 1;
    var NC = Math.ceil((2 * HALF) / CS);
    var S = SPECIES.length;
    var cells = new Array(NC * NC).fill(null);

    /* ---------- utilitários ---------- */
    function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
    function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

    function pickInt(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

    /* ---------- classificação de água ---------- */
    // Mesma regra de oceano do shader da água do jogo: oc = 1 - smooth(-6,55,ji).
    // Rio = dentro de um canal "wet" definido pelo jogo; resto = lago/poça.
    function waterType(x, z) {
      var oc = 1 - smooth(-6, 55, ji(x, z));
      if (oc >= 0.5) return TYPE_OCEAN;
      for (var r = 0; r < rivers.length; r++) {
        var o = rivers[r];
        if (!o.wet) continue;
        var w = o.w(z);
        if (Math.abs(x - o.cx(z)) <= 1.6 * w) return TYPE_RIVER;
      }
      return TYPE_LAKE;
    }

    /* ---------- célula: análise (feita uma vez, em fatias de tempo) ---------- */
    function cellAt(x, z) {
      var ci = Math.floor((x + HALF) / CS), cj = Math.floor((z + HALF) / CS);
      if (ci < 0 || cj < 0 || ci >= NC || cj >= NC) return null;
      return cells[ci * NC + cj];
    }
    function getCell(ci, cj) {
      if (ci < 0 || cj < 0 || ci >= NC || cj >= NC) return null;
      var k = ci * NC + cj, c = cells[k];
      if (!c) {
        var x0 = -HALF + ci * CS, z0 = -HALF + cj * CS;
        c = {
          ci: ci, cj: cj, x0: x0, z0: z0, cx: x0 + CS / 2, cz: z0 + CS / 2,
          state: 0,                       // 0 = não analisada, 1 = água, 2 = seca
          depth: new Float32Array(G * G), type: new Uint8Array(G * G),
          wet: 0, meanD: 0, dom: 0, rawBudget: 0, elig: [], weights: [], obs: [],
          row: 0, sumD: 0, cnt: [0, 0, 0, 0], aIdx: -1, target: undefined, tspec: null,
          active: false, members: [], counts: new Int16Array(S), dist: 1e9, vis: false, tier: FAR_TIER
        };
        cells[k] = c;
      }
      return c;
    }

    // Análise incremental por linhas da grade (limita o custo por quadro).
    function analyzeRows(c, deadline) {
      while (c.row < G) {
        var j = c.row;
        for (var i = 0; i < G; i++) {
          var x = c.x0 + i * STEP, z = c.z0 + j * STEP, k = j * G + i;
          var D = -Fi(x, z);
          if (D < 0.05) { c.depth[k] = 0; c.type[k] = 0; continue; }
          var t = waterType(x, z);
          c.depth[k] = D; c.type[k] = t; c.sumD += D; c.wet++; c.cnt[t]++;
        }
        c.row++;
        if (now() > deadline) return false;
      }
      finalizeCell(c);
      return true;
    }

    function finalizeCell(c) {
      var wet = c.wet, counts = c.cnt;
      c.state = wet < 4 ? 2 : 1;
      if (c.state === 2) { c.rawBudget = 0; c.elig = []; return; }
      c.meanD = c.sumD / wet;
      var rough = 0;
      for (var q = 0; q < G * G; q++) if (c.depth[q] > 0) rough += Math.abs(c.depth[q] - c.meanD);
      rough = clamp(rough / wet / (c.meanD + 0.5), 0, 1);
      // tipo dominante = o de mais amostras de água
      var dom = TYPE_LAKE, best = -1;
      for (var tt = 1; tt <= 3; tt++) if (counts[tt] > best) { best = counts[tt]; dom = tt; }
      c.dom = dom;
      var dens = dom === TYPE_RIVER ? CFG.densities.river : (dom === TYPE_OCEAN ? CFG.densities.ocean : CFG.densities.lake);
      var area = wet * STEP * STEP;
      var depthF = dom === TYPE_OCEAN ? 1 : clamp(c.meanD / 1.4, 0.35, 1);
      var coverF = 0.85 + 0.3 * rough;
      c.rawBudget = area * dens * depthF * coverF;
      // espécies elegíveis: habitat compatível + profundidade média dentro da faixa da espécie
      c.elig = []; c.weights = [];
      for (var s = 0; s < S; s++) {
        var sp = SPECIES[s];
        var habOk = sp.hab === 'marine' ? dom === TYPE_OCEAN : dom !== TYPE_OCEAN;
        if (!habOk) continue;
        if (c.meanD < sp.minD * 0.9 || c.meanD > sp.maxD * 1.5) continue;
        c.elig.push(s); c.weights.push(sp.w);
      }
      analyzeObstacles(c);
    }

    // Pedras/boulders do jogo (lista `fm`) que tocam esta célula ou a margem.
    function analyzeObstacles(c) {
      c.obs = [];
      var m = 8;
      for (var b = 0; b < boulders.length; b++) {
        var bo = boulders[b];
        var r = Math.max(bo.sx, bo.sz) * 0.9;
        if (bo.x < c.x0 - m - r || bo.x > c.x0 + CS + m + r || bo.z < c.z0 - m - r || bo.z > c.z0 + CS + m + r) continue;
        c.obs.push({ x: bo.x, z: bo.z, r2: r * r, yTop: bo.y + bo.sy, yBot: bo.y - bo.sy * 0.5 });
      }
    }

    /* ---------- sondagem de validade (usado pela física) ---------- */
    // Retorna a profundidade (m) se (x,y,z) for água válida para a espécie; senão -1.
    function probe(x, y, z, sp) {
      var c = cellAt(x, z);
      if (!c || c.state !== 1) return -1;
      var i = Math.round((x - c.x0) / STEP), j = Math.round((z - c.z0) / STEP);
      i = clamp(i, 0, G - 1); j = clamp(j, 0, G - 1);
      var k = j * G + i, D = c.depth[k];
      if (D <= 0) return -1;
      var t = c.type[k];
      if (sp.hab === 'marine' ? t !== TYPE_OCEAN : (t !== TYPE_RIVER && t !== TYPE_LAKE)) return -1;
      if (D < Math.max(CFG.minWaterDepth, sp.minD * 0.6, sp.minWater)) return -1;
      if (D > sp.maxD) return -1;                       // habitat: espécies rasas não entram em fundos profundos
      if (-y < sp.cTop * 0.98 || -y > D - sp.cBot * 0.98) return -1;   // sprite inteiro dentro da água
      for (var b = 0; b < c.obs.length; b++) {
        var o = c.obs[b], dx = x - o.x, dz = z - o.z;
        if (dx * dx + dz * dz < o.r2 && y < o.yTop && y > o.yBot) return -1;
      }
      return D;
    }

    // Profundidade local usada para a faixa vertical (sem validar espécie).
    function depthAt(x, z) {
      var c = cellAt(x, z);
      if (!c || c.state !== 1) return 0;
      var i = clamp(Math.round((x - c.x0) / STEP), 0, G - 1), j = clamp(Math.round((z - c.z0) / STEP), 0, G - 1);
      return c.depth[j * G + i];
    }

    /* ---------- pool de peixes ---------- */
    var pool = [], act = [];
    var freeSchools = [];
    for (var pi = 0; pi < CFG.maxFish; pi++) pool.push(makeFish());
    function makeFish() {
      return {
        sp: 0, cell: null, school: null, aIdx: -1, cIdx: -1,
        x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
        wantF: .5, bandT: 0, mood: 0, state: 0, indep: false, indepT: 0,
        k: 1, facing: 1, turn: 1, squash: 1, flip: 1, tilt: 0, frame: 0,
        age: 0, fade: 0, dying: 0, stuck: 0, phase: 0, tgtX: 0, tgtZ: 0, dirX: 1, dirZ: 0
      };
    }

    /* ---------- seleção de espécies e orçamento de célula ---------- */
    function cellTarget(c) {
      var t = Math.round(c.rawBudget * CFG.budgetScale);
      return clamp(t, 0, CFG.maxPerCell);
    }
    // Distribui o orçamento entre espécies elegíveis (maior resto).
    function speciesTargets(c, total) {
      var out = new Int16Array(S), wsum = 0, i;
      for (i = 0; i < c.elig.length; i++) wsum += c.weights[i];
      if (wsum <= 0 || total <= 0) return out;
      var rem = [], used = 0;
      for (i = 0; i < c.elig.length; i++) {
        var share = total * c.weights[i] / wsum, base = Math.floor(share);
        out[c.elig[i]] = base; used += base; rem.push([share - base, c.elig[i]]);
      }
      rem.sort(function (a, b) { return b[0] - a[0]; });
      for (i = 0; used < total && i < rem.length; i++, used++) out[rem[i][1]]++;
      return out;
    }

    function needFor(sp) { return Math.max(CFG.minWaterDepth, sp.minD * 0.6, sp.minWater); }

    // Escolhe um ponto de água válido dentro da célula para a espécie.
    function findSpawnPoint(c, sp) {
      for (var t = 0; t < 40; t++) {
        var i = Math.floor(rnd() * G), j = Math.floor(rnd() * G), k = j * G + i;
        var D = c.depth[k];
        if (D <= 0) continue;
        var ty = c.type[k];
        if (sp.hab === 'marine' ? ty !== TYPE_OCEAN : (ty !== TYPE_RIVER && ty !== TYPE_LAKE)) continue;
        if (D < needFor(sp)) continue;
        var x = c.x0 + i * STEP + (rnd() - 0.5) * STEP * 0.8;
        var z = c.z0 + j * STEP + (rnd() - 0.5) * STEP * 0.8;
        var f = rangeRnd(sp.band[0], sp.band[1]);
        var y = yBand(sp, f, D);
        if (probe(x, y, z, sp) >= 0) return { x: x, y: y, z: z, f: f };
      }
      return null;
    }

    // Altura de nado para uma fração de coluna d'água no ponto (x,z); null se seco.
    function spawnY(sp, x, z, frac) {
      var Dz = depthAt(x, z);
      if (Dz <= 0) return null;
      return yBand(sp, frac, Dz);
    }

    function takeFish() {
      return pool.length ? pool.pop() : null;
    }
    function giveFish(f) {
      f.cell = null; f.school = null; f.aIdx = -1; f.cIdx = -1;
      pool.push(f);
    }

    function takeSchool() {
      var s = freeSchools.length ? freeSchools.pop() : { members: [], cx: 0, cy: 0, cz: 0, vx: 0, vy: 0, vz: 0, n: 0 };
      s.members.length = 0; s.n = 0; return s;
    }

    function spawnGroup(c, s, maxN) {
      var sp = SPECIES[s];
      var pt = findSpawnPoint(c, sp);
      if (!pt) return 0;
      var want = Math.min(pickInt(sp.school[0], sp.school[1]), maxN, CFG.maxFish - act.length);
      if (want < 1) return 0;

      var made = 0;
      var wf = pt.f;
      for (var n = 0; n < want; n++) {
        var f = takeFish();
        if (!f) break;
        var ox = n === 0 ? 0 : rangeRnd(-1.6, 1.6), oz = n === 0 ? 0 : rangeRnd(-1.6, 1.6);
        var x = pt.x + ox, z = pt.z + oz;
        var y = spawnY(sp, x, z, wf);

        if (D < 0) { x = pt.x; z = pt.z; y = spawnY(sp, x, z, wf); D = y === null ? -1 : probe(x, y, z, sp); if (D < 0) { giveFish(f); continue; } }
        f.sp = s; f.cell = c; f.x = x; f.y = y; f.z = z;
        f.vx = rangeRnd(-1, 1) * sp.speed * 0.5; f.vy = 0; f.vz = rangeRnd(-1, 1) * sp.speed * 0.5;
        f.wantF = wf; f.bandT = rangeRnd(5, 12); f.mood = rangeRnd(1, 4); f.state = 0;
        f.indep = false; f.indepT = 0;
        f.k = rangeRnd(0.85, 1.15); f.facing = f.vx < 0 ? -1 : 1; f.turn = 1; f.squash = 1; f.flip = f.facing;
        f.tilt = 0; f.frame = rnd() * COLS; f.age = 0; f.fade = 0; f.dying = 0; f.stuck = 0; f.phase = pickInt(0, 7);
        var sl = Math.hypot(f.vx, f.vz) || 1; f.dirX = f.vx / sl; f.dirZ = f.vz / sl;
        f.tgtX = x; f.tgtZ = z;
        if (school) { f.school = school; school.members.push(f); school.n++; }
        addToCell(c, f);
        f.aIdx = act.length; act.push(f);
        made++;

      if (school && school.n === 0) freeSchools.push(school);

      return made;
    }

    function addToCell(c, f) {
      f.cIdx = c.members.length; c.members.push(f);
    }
    function removeFromCell(f) {
      var c = f.cell; if (!c) return;
      var last = c.members.pop();
      if (last !== f) { c.members[f.cIdx] = last; last.cIdx = f.cIdx; }
      c.counts[f.sp] = Math.max(0, c.counts[f.sp] - 1);
      f.cell = null;
    }

    // Libera um peixe: remove do cardume/célula; fade-out opcional.
    function releaseFish(f, reason, fadeOut) {
      if (f.dying > 0) return;
      if (f.school) {
        var m = f.school.members, idx = m.indexOf(f);
        if (idx >= 0) { var l = m.pop(); if (l !== f) m[idx] = l; }
        f.school.n--;
        if (f.school.n <= 0) freeSchools.push(f.school);
        f.school = null;
      }
      removeFromCell(f);
      stats.released[reason] = (stats.released[reason] || 0) + 1;
      if (fadeOut) { f.dying = CFG.fadeOutTime; return; }
      freeActive(f);
    }
    function freeActive(f) {
      var i = f.aIdx, last = act[act.length - 1];
      if (last !== f) { act[i] = last; last.aIdx = i; }
      act.pop(); f.aIdx = -1; f.dying = 0;
      giveFish(f);
    }

    /* ---------- ativação de células (histerese) ---------- */
    function neighborsReady(c) {
      for (var di = -1; di <= 1; di++) for (var dj = -1; dj <= 1; dj++) {

      }
      return true;
    }
    var activeList = [];
    function activate(c) {
      c.active = true;
      c.target = cellTarget(c);
      c.tspec = speciesTargets(c, c.target);

    }
    function deactivate(c) {

      c.active = false;
      var last = activeList[activeList.length - 1];
      if (last !== c) { activeList[c.aIdx] = last; last.aIdx = c.aIdx; }
      activeList.pop(); c.aIdx = -1;
    }

    /* ---------- movimento ---------- */
    function stepFish(f, dt, reduced) {
      var sp = SPECIES[f.sp];
      f.mood -= dt; f.bandT -= dt; f.indepT -= dt;
      if (f.indepT <= 0 && f.school) { f.indep = false; f.indepT = rangeRnd(8, 20); }
      if (f.mood <= 0) {
        var r = rnd();
        f.state = r < (sp.pred ? 0.22 : 0.12) ? 2 : (r < 0.4 ? 0 : 1); // 0 cruzeiro,1 lento,2 rajada
        if (f.state === 1 && rnd() < 0.5) f.state = 3;                  // 3 = ociosa
        f.mood = rangeRnd(2, 6) * f.k;
        if (f.school && rnd() < 0.25) { f.indep = true; f.indepT = rangeRnd(6, 12); }
        pickTarget(f, sp);
      }
      if (f.bandT <= 0) { f.wantF = rangeRnd(sp.band[0], sp.band[1]); f.bandT = rangeRnd(5, 14); }
      var dxT = f.tgtX - f.x, dzT = f.tgtZ - f.z;
      if (dxT * dxT + dzT * dzT < 0.8) pickTarget(f, sp);

      var D = depthAt(f.x, f.z);
      if (D <= 0) D = 0.5;
      var wantY = yBand(sp, f.wantF, D);
      var mul = f.state === 2 ? sp.burst : (f.state === 1 ? 0.35 : (f.state === 3 ? 0.12 : 1));
      var spd = sp.speed * mul * f.k;

      var dx = f.tgtX - f.x, dz = f.tgtZ - f.z, dl = Math.hypot(dx, dz) || 1;
      var dvx = dx / dl * spd, dvz = dz / dl * spd;
      var dvy = clamp((wantY - f.y) * 0.6, -spd * 0.4, spd * 0.4);

      // cardume: coesão e alinhamento (exceto quando separado)
      if (f.school && !f.indep && f.school.n > 1) {
        var sc = f.school;
        var cx = sc.cx - f.x, cz = sc.cz - f.z;
        dvx += clamp(cx * 0.15, -spd * 0.4, spd * 0.4) + clamp((sc.vx - f.vx) * 0.25, -spd * 0.3, spd * 0.3);
        dvz += clamp(cz * 0.15, -spd * 0.4, spd * 0.4) + clamp((sc.vz - f.vz) * 0.25, -spd * 0.3, spd * 0.3);
        dvy += clamp((sc.cy - f.y) * 0.1, -0.05, 0.05);
        var m = sc.members;
        for (var q = 0; q < m.length; q++) {
          var o = m[q]; if (o === f) continue;

        }
      }

      // correnteza do rio (ajuda espécies reofílicas a segurar posição, outras são empurradas)
      if (sp.hab === 'fresh') {
        var fl = flowAt(f.x, f.z);
        if (fl) {
          var fk = CFG.flowScale * (0.25 + 0.75 * sp.rheo);
          dvx += fl.vx * fk; dvz += fl.vz * fk;
        }
      }

      // ondulação suave (movimento não robótico)
      var wob = Math.sin(f.age * (1.6 + f.k) + f.phase) * spd * 0.25;
      var pl = Math.hypot(dvx, dvz) || 1;
      var pxw = -dvz / pl * wob, pzw = dvx / pl * wob;
      dvx += pxw; dvz += pzw;

      // evitar margens e pedras: antecipa e procura direção livre
      var la = CFG.lookAhead;
      var lx = f.x + (f.vx + dvx) * 0.5 * la, lz = f.z + (f.vz + dvz) * 0.5 * la;
      if (probe(lx, f.y, lz, sp) < 0) {
        var base = Math.atan2(dvz, dvx), found = false, ang;
        var offs = [0.6, -0.6, 1.2, -1.2, 1.9, -1.9, Math.PI];
        for (var oi = 0; oi < offs.length && !found; oi++) {
          ang = base + offs[oi];
          var cx2 = Math.cos(ang) * spd, cz2 = Math.sin(ang) * spd;
          var tx = f.x + cx2 * la, tz = f.z + cz2 * la;
          if (probe(tx, f.y, tz, sp) >= 0) { dvx = cx2; dvz = cz2; found = true; }
        }
        if (!found) { dvx = -f.vx; dvz = -f.vz; }   // sem saída: inverte
      }

      // suavização de curva
      var k2 = Math.min(1, dt * (reduced ? 1.2 : 2.4));
      f.vx += (dvx - f.vx) * k2; f.vy += (dvy - f.vy) * k2; f.vz += (dvz - f.vz) * k2;
      var vmax = spd * 1.5 + 0.05, vl = Math.hypot(f.vx, f.vz);
      if (vl > vmax) { f.vx *= vmax / vl; f.vz *= vmax / vl; }
      f.vy = clamp(f.vy, -vmax * 0.5, vmax * 0.5);

      // integração com verificação dura de habitat
      var nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;
      var ny = clamp(f.y + f.vy * dt, -(D - sp.cBot), -sp.cTop);
      var Dn = probe(nx, ny, nz, sp);
      if (Dn < 0) {
        f.vx *= -0.5; f.vz *= -0.5; f.vy *= 0.5;
        f.stuck += dt;
      } else {
        f.x = nx; f.z = nz; f.y = clamp(ny, -(Dn - sp.cBot), -sp.cTop);
        f.stuck = Math.max(0, f.stuck - dt * 2);
      }
    }

    function pickTarget(f, sp) {
      for (var t = 0; t < 10; t++) {
        var ang = rnd() * TAU, r = rangeRnd(4, 12);
        var tx = f.x + Math.cos(ang) * r, tz = f.z + Math.sin(ang) * r;
        if (probe(tx, f.y, tz, sp) >= 0) { f.tgtX = tx; f.tgtZ = tz; return; }
      }
      f.tgtX = f.x + f.vx * 2; f.tgtZ = f.z + f.vz * 2;
    }

    function animate(f, dt) {
      var sp = SPECIES[f.sp];
      var dir = f.vx < 0 ? -1 : 1;
      if (f.turn >= 1 && dir !== f.facing) f.turn = 0;
      if (f.turn < 1) {
        var prev = f.turn;
        f.turn = Math.min(1, f.turn + dt * 4.5);
        if (prev < 0.5 && f.turn >= 0.5) f.facing = dir;
      }
      // direção horizontal de natação, suavizada (o sprite gira com a curva)
      var hl = Math.hypot(f.vx, f.vz);
      if (hl > 0.02) {

function refWeapon(key) {
  const model = window.__vitrineModels[key]();

    model.position.y = 0.5;                                     // centro do cabo do modelo (y ≈ -0.5) → origem
    holder.rotation.y = ROLL;
    let top = -1e9;                                             // ponta da lâmina, medida no próprio modelo
    model.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || !o.geometry.attributes.position) return;

  const y = dirW.clone().normalize().negate();    // no rig o osso vai para -Y (junta → filho)

function solveChain(root, mid, end, target, pole, RS) {
  root.parent.updateWorldMatrix(true, false);
  const S = root.getWorldPosition(new T.Vector3());
  const l1 = mid.position.length() * RS, l2 = end.position.length() * RS;
  const dv = target.clone().sub(S);
  const d = Math.min(Math.max(dv.length(), 1e-4), (l1 + l2) * 0.9995);
  const u = dv.clone().normalize();
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);

  if (p.lengthSq() < 1e-8) p = Math.abs(u.y) < 0.9 ? new T.Vector3(0, 1, 0).addScaledVector(u, -u.y) : new T.Vector3(1, 0, 0);

  root.updateWorldMatrix(true, false);
  mid.updateWorldMatrix(true, false);

  mid.updateWorldMatrix(true, false);

  const P = p.clone().normalize();

  H.normalize();

  if (mode === 'y') { y = P; z = H; x = new T.Vector3().crossVectors(y, z).normalize(); }
  else { z = P; y = H; x = new T.Vector3().crossVectors(y, z).normalize(); }

    return 'hit';
  }
  if (def.hasShield) return r < 0.55 ? 'block' : 'hit';
  if (S.kind === 'thrust') return r < 0.3 ? 'dodge' : 'hit';
  return r < 0.3 ? 'parry' : 'hit';
}
function startAttack(att, def) {
  if (X || !att.wkey || !att.armed) return false;
  const reach = D_ENG * rsOf(att.rig) * 1.65;
  const mode = dist2D(att, def) <= reach ? (window.__combatForce || pickResponse(att, def)) : 'whiff';
  const inter = buildInter(att, def, mode, att.isPlayer ? 0.28 : 0.6);
  X = { inter, t: 0, fired: false, slide: mode !== 'whiff' };
  updateHud(att.isPlayer ? 'Atacando…' : 'O adversário ataca!');
  return true;
}

/* ---------- Entrada ---------- */
addEventListener('keydown', e => {
  if (e.repeat || (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
  keyDown[e.code] = true;
  if (!P) return;
  switch (e.code) {
    case 'KeyJ':
      if (blocked()) break;
      if (!P.armed) { setDrawn(true); break; }
      if (E) startAttack(P, E);
      break;
    case 'KeyH': setDrawn(!P.armed); break;
    case 'KeyT': wIdx = (wIdx + 1) % WKEYS.length; P.setGear(WKEYS[wIdx], playerShield); updateHud(); break;
    case 'KeyV': break;                                   // o escudo acompanha sacar/guardar (H)
    case 'KeyN': enemyOn = !enemyOn; if (E) E.rig.visible = enemyOn; if (!enemyOn) X = null; updateHud(); break;
  }
});
addEventListener('keyup', e => { keyDown[e.code] = false; });
addEventListener('blur', () => { for (const k in keyDown) keyDown[k] = false; });
// Histerese da luta: uma condição só solta a postura de combate depois de ficar falsa por HOLD_T.
// Sinais que piscam (água na altura do quadril, limite de 18 m) não ligam/desligam o braço a cada quadro.
const HOLD_T = 0.25;
function holdCombat(F, cond, dt) {
  if (cond) { F.holdT = HOLD_T; return true; }
  F.holdT = Math.max(0, F.holdT - dt);
  return F.holdT > 0;
}
function blocked() {
  const hs = window.__horse, sw = window.__sw || {};
  return !!((hs && hs.riding()) || sw.swim || sw.ud > 0.05);
}

/* ---------- Colisão simples do adversário (sólidos do cenário + jogador) ---------- */
function pushEnemy(x, z, px, pz) {
  const Gd = window.__solidGrid;
  if (Gd) {
    for (let it = 0; it < 2; it++) {
      const gx = Math.floor(x / Gd.cell), gz = Math.floor(z / Gd.cell);
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const arr = Gd.map.get((gx + i) + ',' + (gz + j)); if (!arr) continue;
        for (const o of arr) {
          const dx = x - o.x, dz = z - o.z, d = Math.hypot(dx, dz), m = (o.p ? window.__profR(o.p, dx, dz) : o.r) + 0.3;
          if (d < m && d > 1e-6) { x = o.x + dx / d * m; z = o.z + dz / d * m; }
        }
      }
    }
  }
  const dx = x - px, dz = z - pz, d = Math.hypot(dx, dz), m = 0.75;
  if (d < m && d > 1e-6) { x = px + dx / d * m; z = pz + dz / d * m; }
  return [x, z];
}

/* ---------- Atualização do adversário ---------- */
function updateEnemy(dt, now) {
  const rig = E.rig, rs = rsOf(rig), pp = P.rig.position;
  const ex = rig.position.x, ez = rig.position.z;
  const dx = pp.x - ex, dz = pp.z - ez, d = Math.hypot(dx, dz);
  const hostile = enemyOn && P.armed && !blocked() && d < 18;
  const engaged = !!X && (X.inter.att === E || X.inter.def === E);
  // olhar para o jogador (perto) — sempre suave
  if (d < 22) rig.rotation.y += angDiff(rig.rotation.y, Math.atan2(dx, dz)) * (1 - Math.exp(-dt * 5));
  let nx = ex, nz = ez, wTarget = 0, dl = [0, 1];
  const D = D_ENG * rs;
  if (engaged) {
    if (X.slide) {                                                  // aproxima/afasta até a distância de engajamento
      const ux = -dx / (d || 1), uz = -dz / (d || 1);
      const tx = pp.x + ux * D, tz = pp.z + uz * D, k = 1 - Math.exp(-dt * 4);
      nx += (tx - nx) * k; nz += (tz - nz) * k;
    }
  } else if (hostile) {
    if (d > D + 0.4) { wTarget = 1; dl = [0, 1]; }
    else if (d < D - 0.4) { wTarget = 1; dl = [0, -1]; }
    atkTimer -= dt;
    if (!X && atkTimer <= 0 && d < D * 1.5) { startAttack(E, P); atkTimer = 2.8 + Math.random() * 3; }
  }
  E.wv += (wTarget - E.wv) * Math.min(1, dt * 5);
  if (E.wv < 0.001) E.wv = 0;
  if (wTarget > 0) E.dl = dl;
  if (E.wv > 0) {
    const stride = 1.1 + 1.1 * Math.abs(E.dl[1]), freq = 0.9;
    E.phase += freq * dt;
    const v = 2 * stride * freq * E.wv * rs;                        // m/s: mesma velocidade dos pés
    const f = new T.Vector3(E.dl[0], 0, E.dl[1]).applyQuaternion(rig.quaternion);
    nx += f.x * v * dt; nz += f.z * v * dt;
  }
  [nx, nz] = pushEnemy(nx, nz, pp.x, pp.z);
  if (DM(nx, nz) > 0.15 && (!window.__inWorld || window.__inWorld(nx, nz))) { rig.position.x = nx; rig.position.z = nz; }
  const gy = DM(rig.position.x, rig.position.z) + 0.1 * rs + 0.01;
  rig.position.y += (gy - rig.position.y) * Math.min(1, dt * 12);
  rig.updateMatrixWorld(true);
  // pose
  let pose = null;
  if (X) { const tr = X.inter.tracks.find(a => a[0] === E); if (tr) pose = evalKeys(tr[1], X.t); }
  // postura de luta entra/sai por peso suave, igual ao jogador: a arma não pula entre as duas posturas
  const cOn = holdCombat(E, hostile || engaged, dt);
  E.cK += ((cOn ? 1 : 0) - E.cK) * Math.min(1, dt * 6);
  if (!pose) {
    const base = E.wv > 0.001 ? walkPose(E.wv, E.phase, E.dl) : idlePose(now);
    pose = E.cK > 0.001 ? mixPose(base, combatIdle(E.hasShield ? DEF_SHIELD : DEF_BLADE, now), E.cK) : base;   // pronto para a luta
  }
  applyPose(E, pose);
  if (X && X.inter.kind && X.inter.att === E) {
    const w = contactWeight(X.t, X.inter.attackTi);
    if (w > 0) aimAttacker(E, P, X.inter.kind, w);
  }
}

/* ---------- Atualização do jogador (camada de combate sobre a animação do jogo) ---------- */
const BLEND = ['Bone_Hips', 'Bone_Spine', 'Bone_Neck', 'Bone_Shoulder_R', 'Bone_Elbow_R', 'Bone_Hand_R', 'Bone_Shoulder_L', 'Bone_Elbow_L', 'Bone_Hand_L',
  'Bone_UpperLeg_R', 'Bone_LowerLeg_R', 'Bone_Ankle_R', 'Bone_UpperLeg_L', 'Bone_LowerLeg_L', 'Bone_Ankle_L'];
const LEGS = new Set(['Bone_UpperLeg_R', 'Bone_LowerLeg_R', 'Bone_Ankle_R', 'Bone_UpperLeg_L', 'Bone_LowerLeg_L', 'Bone_Ankle_L']);
const _q0 = {}; BLEND.forEach(n => { _q0[n] = new T.Quaternion(); });
const _hip0 = new T.Vector3(), _baseH = new T.Vector3(), _outH = new T.Vector3();
const _base = {}, _out = {}, _has = {}; BLEND.forEach(n => { _base[n] = new T.Quaternion(); _out[n] = new T.Quaternion(); _has[n] = false; });
let _hasH = false;
function updatePlayer(dt, now) {
  const rig = P.rig, B = P.B;
  // o jogo só escreve o eixo X nos cotovelos, joelhos e tornozelos; Y/Z sobrariam do IK de combate e torceriam o membro ao sair da luta
  for (const n of ['Bone_Elbow_R', 'Bone_Elbow_L', 'Bone_LowerLeg_R', 'Bone_LowerLeg_L', 'Bone_Ankle_R', 'Bone_Ankle_L']) { B[n].rotation.y = 0; B[n].rotation.z = 0; }
  B.Bone_Hand_R.quaternion.copy(HAND_REST.R);                       // posição de repouso da arma/escudo
  B.Bone_Hand_L.quaternion.copy(HAND_REST.L);
  const inInter = !!X && (X.inter.att === P || X.inter.def === P);
  defending = !!keyDown.KeyK && !inInter && !blocked();
  P.defK += ((defending ? 1 : 0) - P.defK) * Math.min(1, dt * 10);
  const explicitOff = !E || !P.armed || !enemyOn;                       // H, N ou sem inimigo: solta na hora
  if (explicitOff) P.holdT = 0;
  const inCombat = !explicitOff && holdCombat(P, !blocked(), dt);       // água/cavalo: só solta após HOLD_T sem sinal
  const wT = (inInter || defending || inCombat) ? 1 : 0;
  W += (wT - W) * Math.min(1, dt * (wT > W ? 10 : 5));
  // Base = o que o JOGO escreveu neste quadro. Se o jogo não reescreveu um osso, ele ainda guarda a nossa saída
  // anterior; nesse caso a base é a que guardamos (evita acumular a mistura quadro a quadro).
  for (const n of BLEND) {
    if (_has[n] && B[n].quaternion.equals(_out[n])) _q0[n].copy(_base[n]); else _q0[n].copy(B[n].quaternion);
  }
  if (_hasH && B.Bone_Hips.position.equals(_outH)) _hip0.copy(_baseH); else _hip0.copy(B.Bone_Hips.position);
  for (const n of BLEND) _base[n].copy(_q0[n]);
  _baseH.copy(_hip0);
  if (W < 0.002) {                                                  // camada desligada: devolve a base ao jogo e sai
    W = 0;
    if (!wT) {
      if (_has.Bone_Hips) { for (const n of BLEND) B[n].quaternion.copy(_q0[n]); B.Bone_Hips.position.copy(_hip0); }
      for (const n of BLEND) _has[n] = false; _hasH = false;
      return;
    }
  }
  const yaw0 = rig.rotation.y;
  const mv = sm(((window.__sw && window.__sw.spd) || 0) / 1.2 - 0.15);   // 0 = parado, 1 = em movimento
  // vira para o adversário
  if (E) rig.rotation.y = yaw0 + angDiff(yaw0, Math.atan2(E.rig.position.x - rig.position.x, E.rig.position.z - rig.position.z)) * W;
  rig.updateMatrixWorld(true);
  let pose;
  if (inInter) { const tr = X.inter.tracks.find(a => a[0] === P); pose = tr ? evalKeys(tr[1], X.t) : GUARD; }
  else pose = mixPose(combatIdle(GUARD, now), P.hasShield ? DEF_SHIELD : DEF_BLADE, P.defK);
  applyPose(P, pose);
  if (X && X.inter.kind && X.inter.att === P) {
    const w = contactWeight(X.t, X.inter.attackTi);
    if (w > 0) aimAttacker(P, E, X.inter.kind, w);
  }
  const wUp = W, wLeg = W * (1 - mv), wHip = W * (1 - 0.6 * mv);
  for (const n of BLEND) {
    const k = LEGS.has(n) ? wLeg : wUp;
    B[n].quaternion.slerpQuaternions(_q0[n], B[n].quaternion.clone(), k);
  }
  B.Bone_Hips.position.lerpVectors(_hip0, B.Bone_Hips.position, wHip);
  for (const n of BLEND) { _out[n].copy(B[n].quaternion); _has[n] = true; }
  _outH.copy(B.Bone_Hips.position); _hasH = true;
  rig.updateMatrixWorld(true);
}

/* ---------- Gancho por quadro (chamado pelo loop do jogo depois do update do jogador) ---------- */
let t0 = 0;
window.__combatHook = function (dt, now) {
  try {
    const r = G.getRig();
    if (!r) return;
    if (!P || P.rig !== r) setupPlayer(r);
    if (!E && P && !blocked() && !window.__combatNoEnemy) { if (!setupEnemy()) { window.__combatNoEnemy = true; } updateHud(); }
    if (blocked() && X) X = null;                                   // montar / nadar cancela o combate sem travar nada
    if (X) {
      X.t += dt;
      // K apertado depois que o adversário já começou o golpe: o jogador defende a tempo
      if (!X.fired && X.inter.mode === 'hit' && X.inter.att === E && X.inter.def === P && keyDown.KeyK && X.t < X.inter.impact - 0.05) reactMidWindup();
      if (!X.fired && X.t >= X.inter.impact) {
        X.fired = true;
        if (X.inter.mode !== 'whiff') {
          const c = contactPoint(X.inter.def, X.inter.kind, X.inter.att);
          lastC = c.clone(); flashT = 0.45; flash.visible = true;
        }
        updateHud(X.inter.att.isPlayer ? X.inter.label : (X.inter.mode === 'hit' ? 'Você foi atingido' : 'Você defendeu'));
        msgT = 1.6;
      }
      if (X.t >= X.inter.dur) X = null;                             // fim: ambos voltam ao controle normal
    }
    if (msgT > 0) { msgT -= dt; if (msgT <= 0) updateHud(''); }
    if (E && E.rig.visible) updateEnemy(dt, now);
    updatePlayer(dt, now);
    if (P) P.tickDraw(dt);
    if (E) E.tickDraw(dt);
    updateCombatCamera(dt);
    if (lastC && flashT > 0) {
      flashT -= dt;
      const k = Math.max(0, flashT / 0.45);
      flash.position.copy(lastC); flash.material.opacity = k; flash.scale.setScalar(1 + (1 - k) * 1.5);
      if (flashT <= 0) flash.visible = false;
    }
  } catch (err) {
    console.error('[combate] desativado por erro:', err);
    window.__combatHook = null;                                     // nunca derruba o jogo
  }
};

window.__combat = {
  get state() { return { X: X && { mode: X.inter.mode, t: X.t, dur: X.inter.dur, impact: X.inter.impact }, W, defending, enemyOn, weapon: P && P.wkey, shield: P && P.hasShield, armed: P && P.armed }; },
  get player() { return P; }, get enemy() { return E; },
  attack() { return !!P && !!E && startAttack(P, E); },
  enemyAttack() { return !!P && !!E && startAttack(E, P); },
  setWeapon(k) { wIdx = Math.max(0, WKEYS.indexOf(k)); P.setGear(WKEYS[wIdx], playerShield); updateHud(); },
  setDefend(v) { keyDown.KeyK = !!v; },
  forceMode(m) { window.__combatForce = m; },
  contactPoint, STYLE, REACT, T
};
}
})();

</script>
